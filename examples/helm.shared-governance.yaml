# Illustrative setup; build the shared-governance image and replace provider metadata first.
replicaCount: 2
image:
  tag: shared-governance
persistence:
  enabled: true
  existingClaim: ''
  size: 5Gi
  accessMode: ReadWriteOnce
secrets:
  existingSecret: inferplane-shared-secrets
config:
  server:
    listen: :8080
    admin_listen: :9090
    admin_auth:
      token_refs:
      - env: INFERPLANE_ADMIN_TOKEN
  key_store:
    type: postgres
    dsn_ref:
      env: INFERPLANE_PG_DSN
    path: null
  audit:
    failure_mode: buffer_then_block
    buffer:
      path: /var/lib/inferplane/audit.wal
    sinks:
    - type: file
      path: /var/lib/inferplane/audit.jsonl
  providers:
    public-chat:
      type: openai_compatible
      base_url: https://chat.example.invalid/v1
      data_boundary: external
      api_key_ref:
        env: ADAPTIVE_PUBLIC_API_KEY
    private-qwen:
      type: openai_compatible
      base_url: https://qwen.internal.example.invalid/v1
      data_boundary: internal
      api_key_ref:
        env: ADAPTIVE_PRIVATE_API_KEY
    private-gemma:
      type: openai_compatible
      base_url: https://gemma.internal.example.invalid/v1
      data_boundary: internal
      api_key_ref:
        env: ADAPTIVE_PRIVATE_API_KEY
    native-responses:
      type: openai_responses
      base_url: https://responses.example.invalid/v1
      data_boundary: external
      api_key_ref:
        env: ADAPTIVE_RESPONSES_API_KEY
    anthropic-direct: null
  models:
    auto:
      context_window: 131072
      capabilities:
      - tools
      targets:
      - provider: public-chat
        model: your-normal-model
    weak:
      context_window: 131072
      capabilities:
      - tools
      targets:
      - provider: private-qwen
        model: your-qwen-model
      - provider: private-gemma
        model: your-gemma-model
    normal:
      context_window: 131072
      capabilities:
      - tools
      targets:
      - provider: public-chat
        model: your-normal-model
    strong:
      context_window: 131072
      capabilities:
      - tools
      targets:
      - provider: public-chat
        model: your-strong-model
    economy:
      context_window: 131072
      capabilities:
      - tools
      targets:
      - provider: private-qwen
        model: your-qwen-model
      - provider: private-gemma
        model: your-gemma-model
    codex-native:
      context_window: 131072
      capabilities:
      - tools
      targets:
      - provider: native-responses
        model: your-responses-model
    claude-sonnet-4-6: null
  model_fallback_family: false
  teams:
    engineering:
      allowed_models:
      - auto
      - weak
      - normal
      - strong
      - economy
      - codex-native
      rate_limit:
        requests_per_minute: 120
        tokens_per_minute: 5000000
      quota:
        tokens_per_day: 50000000
        on_exceeded: block
  pricing:
    on_missing: block
    version: illustrative-adaptive-v1
    overrides:
      public-chat:
        your-normal-model:
          input_per_mtok: 1
          output_per_mtok: 3
        your-strong-model:
          input_per_mtok: 5
          output_per_mtok: 15
      private-qwen:
        your-qwen-model:
          input_per_mtok: 0.2
          output_per_mtok: 0.4
      private-gemma:
        your-gemma-model:
          input_per_mtok: 0.2
          output_per_mtok: 0.4
      native-responses:
        your-responses-model:
          input_per_mtok: 5
          output_per_mtok: 15
  governance_store:
    type: postgres
  budget_timezone: UTC
  control_plane:
    url: https://inferplaned.example.invalid
    require_sync: true
    token_ref:
      env: INFERPLANE_CONTROL_TOKEN
