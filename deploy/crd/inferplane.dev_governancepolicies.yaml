# GovernancePolicy CRD (ADR-035): registers the api/v1alpha1 schema with a
# Kubernetes API server so policy documents are kubectl-native — authored,
# validated (structural schema + CEL rules mirroring internal/policy), and
# stored as cluster objects. The SAME document body works on every channel:
# a local file (`policies` config key), the control-plane push (ADR-034), or
# this CRD. Today enforcement in-cluster flows through the Helm chart's
# policies ConfigMap (kubectl/helm edit → kubelet syncs the mounted file →
# mayu's watcher applies it); the inferplaned CRD-watch controller is the
# follow-up that consumes these objects directly.
#
# CEL validation rules require Kubernetes 1.25+.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: governancepolicies.inferplane.dev
spec:
  group: inferplane.dev
  scope: Namespaced
  names:
    kind: GovernancePolicy
    listKind: GovernancePolicyList
    plural: governancepolicies
    singular: governancepolicy
    shortNames: ["gp"]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Team
          type: string
          jsonPath: .spec.subject.team
        - name: User
          type: string
          jsonPath: .spec.subject.user
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: ["spec"]
          properties:
            spec:
              type: object
              required: ["subject", "rules"]
              properties:
                subject:
                  type: object
                  x-kubernetes-validations:
                    - rule: "has(self.team) || has(self.user)"
                      message: "subject must select a team and/or a user"
                  properties:
                    team:
                      type: string
                      minLength: 1
                    user:
                      type: string
                      minLength: 1
                rules:
                  type: array
                  minItems: 1
                  # Matches internal/policy.maxPolicyRules; bounds aggregate CEL cost.
                  maxItems: 256
                  items:
                    type: object
                    required: ["name", "failurePolicy"]
                    x-kubernetes-validations:
                      # Exactly one rule kind — mirrors internal/policy.
                      - rule: "[has(self.budget), has(self.routing), has(self.modelAccess), has(self.rate), has(self.sensitiveData), has(self.tokenQuota)].filter(x, x).size() == 1"
                        message: "exactly one of budget, routing, modelAccess, rate, sensitiveData, or tokenQuota must be set"
                      - rule: "!has(self.tokenQuota) || self.failurePolicy == 'FailClosed'"
                        message: "tokenQuota requires FailClosed"
                      # A hard-cap budget rule must fail closed (ADR-032).
                      - rule: "!has(self.budget) || !(has(self.budget.hardCap) && self.budget.hardCap) || self.failurePolicy == 'FailClosed'"
                        message: "a hard-cap budget rule must be FailClosed"
                      - rule: "!has(self.sensitiveData) || self.failurePolicy == 'FailClosed'"
                        message: "sensitiveData requires FailClosed"
                      - rule: "!has(self.routing) || !has(self.routing.context) || self.failurePolicy == 'FailOpen'"
                        message: "routing.context requires FailOpen"
                    properties:
                      name:
                        type: string
                        minLength: 1
                      failurePolicy:
                        type: string
                        enum: ["FailOpen", "FailClosed"]
                      budget:
                        type: object
                        x-kubernetes-validations:
                          # unlimited declares "no cap" explicitly instead of
                          # omitting the rule; exactly one of unlimited or
                          # limitMilliUSD must be set, and unlimited must not
                          # be combined with hardCap/lease/period.
                          - rule: "(has(self.unlimited) && self.unlimited) ? !has(self.limitMilliUSD) : has(self.limitMilliUSD)"
                            message: "exactly one of unlimited or limitMilliUSD must be set"
                          - rule: "!(has(self.unlimited) && self.unlimited) || (!has(self.hardCap) && !has(self.lease) && !has(self.period))"
                            message: "unlimited must not be combined with hardCap, lease, or period"
                        properties:
                          unlimited:
                            type: boolean
                          # Money is integer milliUSD: 1000 = $1 (ADR-032).
                          limitMilliUSD:
                            type: integer
                            format: int64
                            minimum: 1
                          hardCap:
                            type: boolean
                          lease:
                            type: object
                            properties:
                              grantMilliUSD:
                                type: integer
                                format: int64
                                minimum: 0
                              renewInterval:
                                type: string
                                # Go duration, e.g. "10s", "1m30s".
                                pattern: "^([0-9]+(\\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$"
                          period:
                            type: string
                            enum: ["CalendarDay", "CalendarMonth"]
                      sensitiveData:
                        type: object
                        required: ["onDetected", "onUninspectable"]
                        x-kubernetes-validations:
                          - rule: "(self.onDetected != 'InternalOnly' && self.onUninspectable != 'InternalOnly') || (has(self.internalModels) && self.internalModels.size() > 0)"
                            message: "InternalOnly requires non-empty internalModels"
                        properties:
                          onDetected:
                            type: string
                            enum: ["InternalOnly", "Block", "Mask"]
                          onUninspectable:
                            type: string
                            enum: ["InternalOnly", "Block"]
                          internalModels:
                            type: array
                            items:
                              type: string
                              minLength: 1
                              pattern: '^[^*?\[\]]*[^*?\[\]\s][^*?\[\]]*$'
                      routing:
                        type: object
                        x-kubernetes-validations:
                          # Exactly one routing subtype; preserve affinity/budget semantics.
                          - rule: "[has(self.onAffinityConflict), has(self.budgetTiers), has(self.context)].filter(x, x).size() == 1"
                            message: "routing rule must set exactly one of onAffinityConflict, budgetTiers, or context"
                        properties:
                          context:
                            type: object
                            required: ["fromModels", "simpleModel", "complexModel", "maxSimpleInputTokens"]
                            x-kubernetes-validations:
                              - rule: "(!has(self.normalModel) && (!has(self.maxNormalInputTokens) || self.maxNormalInputTokens == 0)) || (has(self.normalModel) && has(self.maxNormalInputTokens) && self.maxNormalInputTokens > self.maxSimpleInputTokens)"
                                message: "normalModel requires maxNormalInputTokens greater than maxSimpleInputTokens"
                            properties:
                              mode:
                                type: string
                                enum: ["Shadow", "Enforce"]
                                default: "Shadow"
                              fromModels:
                                type: array
                                minItems: 1
                                items:
                                  type: string
                                  minLength: 1
                                  pattern: '^[^*?\[\]]*[^*?\[\]\s][^*?\[\]]*$'
                              simpleModel:
                                type: string
                                minLength: 1
                                pattern: '^[^*?\[\]]*[^*?\[\]\s][^*?\[\]]*$'
                              complexModel:
                                type: string
                                minLength: 1
                                pattern: '^[^*?\[\]]*[^*?\[\]\s][^*?\[\]]*$'
                              normalModel:
                                type: string
                                minLength: 1
                                pattern: '^[^*?\[\]]*[^*?\[\]\s][^*?\[\]]*$'
                              maxNormalInputTokens:
                                type: integer
                                format: int64
                                minimum: 0
                              stability:
                                type: object
                                x-kubernetes-validations:
                                  - rule: "duration(self.minHold) <= duration(self.sessionTTL) && duration(self.sessionTTL) > duration('0s') && duration(self.sessionTTL) <= duration('24h')"
                                    message: "require 0<=minHold<=sessionTTL<=24h and positive sessionTTL"
                                properties:
                                  minHold:
                                    type: string
                                    default: "5m"
                                    maxLength: 64
                                    pattern: "^([0-9]+(\\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$"
                                  minRequests:
                                    type: integer
                                    default: 3
                                    minimum: 1
                                    maximum: 10000
                                  sessionTTL:
                                    type: string
                                    default: "30m"
                                    maxLength: 64
                                    pattern: "^([0-9]+(\\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$"
                              maxSimpleInputTokens:
                                type: integer
                                format: int64
                                minimum: 1
                              complexKeywords:
                                type: array
                                items:
                                  type: string
                                  minLength: 1
                                  pattern: '\S'
                          onAffinityConflict:
                            type: string
                            enum: ["PreferAffinity", "PreferFallback"]
                          budgetTiers:
                            type: object
                            required: ["budgetRef", "tiers"]
                            x-kubernetes-validations:
                              - rule: "(has(self.enforceTargets) && self.enforceTargets) || self.tiers.all(t, t.thresholdPercent <= 99)"
                                message: "thresholdPercent 100 requires enforceTargets"
                            properties:
                              enforceTargets:
                                type: boolean
                              budgetRef:
                                type: string
                                minLength: 1
                              tiers:
                                type: array
                                minItems: 1
                                # Strictly increasing integer thresholds are in [1, 100].
                                maxItems: 100
                                items:
                                  type: object
                                  required: ["thresholdPercent", "substitute"]
                                  properties:
                                    thresholdPercent:
                                      type: integer
                                      minimum: 1
                                      maximum: 100
                                    substitute:
                                      type: object
                                      minProperties: 1
                                      additionalProperties:
                                        type: string
                                        minLength: 1
                      modelAccess:
                        type: object
                        required: ["allow"]
                        properties:
                          allow:
                            type: array
                            minItems: 1
                            items:
                              type: string
                              minLength: 1
                      tokenQuota:
                        type: object
                        required: ["limitTokens", "period"]
                        properties:
                          limitTokens:
                            type: integer
                            format: int64
                            minimum: 1
                          period:
                            type: string
                            enum: ["CalendarDay", "CalendarMonth"]
                      rate:
                        type: object
                        x-kubernetes-validations:
                          # unlimited declares "no cap" explicitly instead of
                          # omitting the rule (see budget.unlimited above).
                          - rule: "!(has(self.unlimited) && self.unlimited) || (!has(self.rpm) && !has(self.tpm))"
                            message: "unlimited must not be combined with rpm or tpm"
                          - rule: "(has(self.unlimited) && self.unlimited) || (has(self.rpm) && self.rpm > 0) || (has(self.tpm) && self.tpm > 0)"
                            message: "rate must limit at least one of rpm or tpm (or set unlimited: true)"
                        properties:
                          unlimited:
                            type: boolean
                          rpm:
                            type: integer
                            format: int64
                            minimum: 0
                          tpm:
                            type: integer
                            format: int64
                            minimum: 0
