{{- $shared := and (eq (default "" .Values.config.key_store.type) "postgres") (eq (dig "governance_store" "type" "" .Values.config) "postgres") }}
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) (not $shared) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "inferplane.fullname" . }}-data
  labels:
    {{- include "inferplane.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
{{- end }}
{{- end }}
